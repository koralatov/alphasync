name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the stable release after both host jobs and package verification pass
        required: true
        default: false
        type: boolean
      retire_superseded:
        description: Delete reviewed superseded release listings after publication, preserving all source tags and version 1.5.1
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: swift-apps-${{ github.ref }}-${{ github.event_name }}-${{ inputs.publish_release || false }}
  cancel-in-progress: ${{ !inputs.publish_release }}

jobs:
  swift-apps:
    name: Swift apps (${{ matrix.host }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: Apple Silicon
            runner: macos-26
            xcode: canonical
            package: true
          - host: Intel
            runner: macos-15-intel
            xcode: '16.4'
            package: false
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned compiler
        env:
          XCODE_VERSION: ${{ matrix.xcode }}
        run: |
          if [[ "$XCODE_VERSION" == canonical ]]; then XCODE_VERSION=$(cat .xcode-version); fi
          selected_developer="/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer"
          test -d "$selected_developer"
          printf 'DEVELOPER_DIR=%s\n' "$selected_developer" >> "$GITHUB_ENV"
      - name: Check generated target definitions
        run: |
          python3 scripts/generate-project.py
          git diff --exit-code -- AlphaSync/AlphaSync.xcodeproj
      - name: Compile Swift and run core, protocol, and file-protection regressions
        id: shared
        run: |
          swift build --product AlphaSyncUIChecks
          swift test --parallel
          python3 Tests/Packaging/check-packages.py
          python3 Tests/Packaging/check-publication.py
          python3 Tests/Packaging/check-retirement.py
          python3 Tests/Packaging/check-help.py
      - name: Build both native app targets
        id: apps
        if: always() && steps.shared.outcome == 'success'
        env:
          PACKAGE_EDITIONS: ${{ matrix.package }}
        run: |
          mkdir -p build/logs
          profiles=(universal)
          if [[ "$PACKAGE_EDITIONS" == true ]]; then profiles+=(apple-silicon); fi
          for profile in "${profiles[@]}"; do
            source scripts/build-profile.sh "$profile"
            if ! xcodebuild -project AlphaSync/AlphaSync.xcodeproj -scheme "$profile_scheme" \
              -configuration Release -destination 'generic/platform=macOS' \
              -derivedDataPath build/DerivedData build > "build/logs/$profile.log" 2>&1; then
              tail -n 100 "build/logs/$profile.log"
              exit 1
            fi
            products="build/DerivedData/Build/Products/Release/$profile"
            scripts/verify-app.sh "$products/AlphaSync.app" "$profile"
            scripts/verify-symbols.sh "$products"
            if [[ "$PACKAGE_EDITIONS" == true ]]; then
              scripts/package-app.sh "$products/AlphaSync.app" "$profile" "build/downloads/$profile"
              scripts/package-symbols.sh "$products" "$profile" "build/downloads/$profile"
            fi
          done
      - name: Collect matching app editions
        if: matrix.package && steps.apps.outcome == 'success'
        run: |
          version=$(sed -n 's/^MARKETING_VERSION *= *//p' AlphaSync/Build/Version.xcconfig)
          build_number=$(sed -n 's/^CURRENT_PROJECT_VERSION *= *//p' AlphaSync/Build/Version.xcconfig)
          python3 scripts/collect-builds.py --universal build/downloads/universal \
            --apple-silicon build/downloads/apple-silicon --output build/validated-downloads \
            --version "$version" --build "$build_number" --source-commit "$GITHUB_SHA"
      - name: Check native interface behaviour and capture both appearances
        if: always() && steps.shared.outcome == 'success'
        run: swift run --skip-build AlphaSyncUIChecks build/interface-checks
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: AlphaSync-interface-and-logs-${{ matrix.runner }}-${{ github.sha }}
          path: |
            build/interface-checks/*
            build/logs/*
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: success() && matrix.package
        with:
          name: AlphaSync-packages-${{ github.sha }}
          path: build/validated-downloads/*
          if-no-files-found: error

  publish:
    name: Verify downloads and publish
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: swift-apps
    runs-on: macos-26
    timeout-minutes: 15
    concurrency:
      group: alphasync-release-publication
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select the pinned compiler
        run: |
          selected_developer="/Applications/Xcode_$(cat .xcode-version).app/Contents/Developer"
          test -d "$selected_developer"
          printf 'DEVELOPER_DIR=%s\n' "$selected_developer" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: AlphaSync-packages-${{ github.sha }}
          path: build/release-assets
      - name: Verify the downloaded release packages
        run: scripts/verify-release.sh build/release-assets
      - name: Publish the verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/publish-release.py
      - name: Retire the reviewed superseded release listings
        if: inputs.retire_superseded
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 scripts/retire-releases.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: AlphaSync-publication-record-${{ github.sha }}
          path: build/release-verification/*
          if-no-files-found: warn
