name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  swift-core:
    name: Swift file protection milestone
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select the pinned compiler
        run: |
          version=$(cat .xcode-version)
          selected_developer="/Applications/Xcode_$version.app/Contents/Developer"
          test -d "$selected_developer"
          printf 'DEVELOPER_DIR=%s\n' "$selected_developer" >> "$GITHUB_ENV"
      - name: Retain the public USB SDK interface for the transport migration
        run: |
          mkdir -p build/usb-sdk
          sdk=$(xcrun --sdk macosx --show-sdk-path)
          cp "$sdk"/System/Library/Frameworks/IOUSBHost.framework/Headers/*.h build/usb-sdk/
          xcrun swift-symbolgraph-extract -module-name IOUSBHost -target arm64-apple-macos13.0 \
            -sdk "$sdk" -output-dir build/usb-sdk
          for path in "$sdk"/System/Library/Frameworks/IOUSBHost.framework/Modules/*/*.swiftinterface "$DEVELOPER_DIR"/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/macosx/IOUSBHost.swiftmodule/*.swiftinterface; do
            if [[ -f "$path" ]]; then cp "$path" build/usb-sdk/; fi
          done
      - name: Compile the Swift transport and run protocol regressions
        run: |
          swift build --target AlphaSyncHardware
          swift test --parallel
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: AlphaSync-USB-SDK-${{ github.sha }}
          path: build/usb-sdk/*
          if-no-files-found: error
