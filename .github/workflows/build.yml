name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: ${{ matrix.runner }} with Xcode ${{ matrix.xcode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '16.4'
          - runner: macos-15-intel
            xcode: '16.4'
          - runner: macos-26
            xcode: pinned
            archive: true
          - runner: macos-26-intel
            xcode: pinned
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Select the checked toolchain
        run: |
          version='${{ matrix.xcode }}'
          if [[ "$version" == pinned ]]; then version=$(cat .xcode-version); fi
          selected_developer="/Applications/Xcode_$version.app/Contents/Developer"
          test -d "$selected_developer"
          printf 'DEVELOPER_DIR=%s\n' "$selected_developer" >> "$GITHUB_ENV"
      - name: Show the build tools
        run: xcodebuild -version
      - name: Verify the release toolchain
        if: matrix.xcode == 'pinned'
        run: scripts/check-toolchain.sh
      - name: Check shell scripts
        run: bash -n scripts/*.sh
      - name: Run the core and native regression tests
        run: make test sanitize
      - name: Build a universal release app
        run: >-
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -scheme AlphaSync
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData build
      - name: Check architectures, deployment targets, dependencies, signatures, and windows
        run: scripts/verify-app.sh
      - name: Build the debug app
        run: >-
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -scheme AlphaSync
          -configuration Debug -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData build
      - name: Build the diagnostic tool
        run: >-
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -target AppletDump
          -configuration Release SYMROOT="$PWD/build/Products" build
      - name: Check the distribution archive layout
        if: matrix.archive == true
        run: |
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -scheme AlphaSync \
            -configuration Release -destination 'generic/platform=macOS' \
            -archivePath build/AlphaSync.xcarchive -derivedDataPath build/ArchiveData \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO archive
          scripts/verify-app.sh build/AlphaSync.xcarchive/Products/Applications/AlphaSync.app
          test ! -e build/AlphaSync.xcarchive/Products/Applications/AlphaSyncLauncher.app
      - name: Package the universal app
        run: |
          app=build/DerivedData/Build/Products/Release/AlphaSync.app
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
          ditto -c -k --keepParent "$app" "build/AlphaSync-$version-$build_number-macOS-11.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AlphaSync-${{ matrix.runner }}-${{ github.sha }}
          path: build/AlphaSync-*-macOS-11.zip
          if-no-files-found: error

  default-xcode:
    name: Default Xcode source check, separate from releases
    runs-on: macos-26
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show the runner's default Xcode
        run: xcodebuild -version
      - name: Run the core and native regression tests
        run: make test sanitize
      # New Xcode versions can stop supporting macOS 11.  This lane checks source
      # compatibility with a newer SDK and must never supply a release artifact.
      - name: Build against the default SDK with a macOS 12 minimum
        run: >-
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -scheme AlphaSync
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/DefaultXcode MACOSX_DEPLOYMENT_TARGET=12.0 build
      - name: Verify this compatibility build
        run: scripts/verify-app.sh build/DefaultXcode/Build/Products/Release/AlphaSync.app 12.0
