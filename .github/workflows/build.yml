name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: macOS on ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      # Xcode 16.4 supports macOS 11 deployment targets on both architectures.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show the build tools
        run: xcodebuild -version
      - name: Test the portable core
        run: make test sanitize
      - name: Build a universal release app
        run: >-
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -scheme AlphaSync
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData build
      - name: Check the executable architectures
        run: |
          lipo build/DerivedData/Build/Products/Release/AlphaSync.app/Contents/MacOS/AlphaSync -verify_arch x86_64 arm64
          lipo build/DerivedData/Build/Products/Release/AlphaSyncLauncher.app/Contents/MacOS/AlphaSyncLauncher -verify_arch x86_64 arm64
      - name: Check the app bundle and load every window
        run: |
          app=build/DerivedData/Build/Products/Release/AlphaSync.app
          helper="$app/Contents/Library/LoginItems/AlphaSyncLauncher.app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$app/Contents/Info.plist")" = 11.0
          test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$helper/Contents/Info.plist")" = 11.0
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/AlphaSync" --smoke-test
      - name: Build the debug app
        run: >-
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -scheme AlphaSync
          -configuration Debug -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData build
      - name: Build the diagnostic tool
        run: >-
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -target AppletDump
          -configuration Release SYMROOT="$PWD/build/Products" build
      - name: Package the universal app
        run: ditto -c -k --keepParent build/DerivedData/Build/Products/Release/AlphaSync.app build/AlphaSync-macOS-11.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AlphaSync-${{ matrix.runner }}
          path: build/AlphaSync-macOS-11.zip
          if-no-files-found: error
