name: Build and test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    name: ${{ matrix.runner }} with Xcode ${{ matrix.xcode }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            xcode: '16.4'
          - runner: macos-15-intel
            xcode: '16.4'
          - runner: macos-26
            xcode: '26.6'
          - runner: macos-26-intel
            xcode: '26.6'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    env:
      # Both toolchains support macOS 11 deployment targets.
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app/Contents/Developer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Show the build tools
        run: xcodebuild -version
      - name: Test the portable core
        run: make test sanitize
      - name: Build a universal release app
        run: >-
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -scheme AlphaSync
          -configuration Release -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData build
      - name: Check architectures, deployment targets, dependencies, signatures, and windows
        run: scripts/verify-app.sh
      - name: Build the debug app
        run: >-
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -scheme AlphaSync
          -configuration Debug -destination 'generic/platform=macOS'
          -derivedDataPath build/DerivedData build
      - name: Build the diagnostic tool
        run: >-
          xcodebuild -project AlphaSync/AlphaSync.xcodeproj -target AppletDump
          -configuration Release SYMROOT="$PWD/build/Products" build
      - name: Package the universal app
        run: ditto -c -k --keepParent build/DerivedData/Build/Products/Release/AlphaSync.app build/AlphaSync-macOS-11.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: AlphaSync-${{ matrix.runner }}
          path: build/AlphaSync-macOS-11.zip
          if-no-files-found: error
