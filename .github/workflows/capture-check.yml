name: Interface capture check

on:
  workflow_dispatch:
    inputs:
      source_commit:
        description: Full source commit to check
        required: true
        default: '05df92170cdddd4fb392246443a0f75930db4ec2'
        type: string

permissions:
  contents: read

jobs:
  capture:
    name: Capture check (Apple Silicon)
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - name: Require an exact source commit
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: '[[ "$SOURCE_COMMIT" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_commit }}
          persist-credentials: false
      - name: Select the pinned compiler
        run: |
          selected_xcode=$(cat .xcode-version)
          selected_developer="/Applications/Xcode_$selected_xcode.app/Contents/Developer"
          test -d "$selected_developer"
          printf 'DEVELOPER_DIR=%s\n' "$selected_developer" >> "$GITHUB_ENV"
      - name: Record the source and host
        env:
          SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"
          test "$(uname -m)" = arm64
          mkdir -p build/interface-checks
          {
            git rev-parse HEAD
            sw_vers
            uname -m
            xcodebuild -version
          } > build/interface-checks/source-and-host.txt
      - name: Compile the interface-check executable
        run: |
          swift build --product AlphaSyncUIChecks
          printf 'INTERFACE_CHECK_EXECUTABLE=%s/AlphaSyncUIChecks\n' "$(swift build --show-bin-path)" >> "$GITHUB_ENV"
      - name: Check native interface behaviour and capture both appearances
        run: |
          set -o pipefail
          python3 scripts/check-interface.py build/interface-checks 2>&1 | tee build/interface-checks/check.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: AlphaSync-capture-check-macos-26-${{ github.run_id }}
          path: build/interface-checks/*
          if-no-files-found: warn
